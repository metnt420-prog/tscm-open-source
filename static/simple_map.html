<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TSCM Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#060608;color:#c8b080;font-family:'Courier New',monospace;overflow:hidden}
#bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:4px 12px;background:#0c0c12;border-top:1px solid rgba(200,140,50,0.12);font-size:10px;color:rgba(180,140,80,0.6);gap:12px}
#bar span{white-space:nowrap}
#map-container{position:fixed;inset:0 0 28px 0;display:flex;align-items:center;justify-content:center;background:#060608}
#map-img{max-width:100%;max-height:100%;object-fit:contain}
#ld{position:fixed;inset:0;z-index:10000;background:#060608;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;transition:opacity 0.3s}
#ld.hide{opacity:0;pointer-events:none}
.sp{width:22px;height:22px;border:2px solid rgba(180,140,80,0.1);border-top-color:#d08828;border-radius:50%;animation:rot 0.7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.msg{font-size:12px;color:rgba(180,140,80,0.6);letter-spacing:0.05em}
a{color:#d08828;text-decoration:none}
</style>
</head>
<body>
<div id="ld"><div class="sp"></div><div class="msg">LOADING MAP...</div></div>
<div id="map-container"><img id="map-img" alt="TSCM Map" onload="onLoad()" onerror="onErr()"></div>
<div id="bar">
  <span id="bs">SRC --</span>
  <span id="ba">AoA --</span>
  <span id="bp">SDR --</span>
  <span id="bu">BT --</span>
  <span id="bt">--</span>
  <span><a href="/live">DASHBOARD</a></span>
</div>
<script>
var API=window.location.origin, REFRESH=5000;
function $(id){return document.getElementById(id)}
function tx(id,t){var e=$(id);if(e)e.textContent=t}
function onLoad(){$('ld').classList.add('hide')}
function onErr(){$('map-img').src=API+'/map.png?'+Date.now()}

function refresh(){
 $('map-img').src=API+'/map.png?'+Date.now();
 fetch(API+'/api/detections',{signal:AbortSignal.timeout(5000)})
  .then(function(r){return r.json()})
  .then(function(d){
   var n=(d.sources||[]).length, bp=0, att=0;
   if(d.sources){d.sources.forEach(function(s){
    if(s.detector==='parametric_beat_pair')bp++;
    if(s.detector==='parametric_attack_confirmed')att++;
   })}
   tx('bs','SRC '+n); tx('bp','BT '+bp+' ATK '+att);
   if(d.observer&&d.observer.aoa!=null)tx('ba','AoA '+d.observer.aoa.toFixed(0)+'\xB0');
   var sdr=[];
   if(d.observer.bladerf)sdr.push('B');
   if(d.observer.hackrf)sdr.push('H');
   if(d.observer.rtlsdr)sdr.push('R');
   tx('bp','SDR '+sdr.join('+'));
   tx('bt',new Date().toLocaleTimeString());
  }).catch(function(){});
}

setInterval(refresh,REFRESH);
refresh();
</script>
</body>
</html>
